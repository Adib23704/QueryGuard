name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: queryguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nodejs & pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Lint & Format Check
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/queryguard_test
        run: pnpm test

      - name: Build Library & Executable Binaries
        run: pnpm build

      - name: Test CLI Execution
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/queryguard_test
        run: |
          node dist/bin/queryguard.js --help
          node dist/bin/queryguard.js exec --silent -- pnpm vitest run tests/unit/connection-string.test.ts
